[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Stephan Vedder"]

[workspace.dependencies]
medicus-core = { path = "crates/medicus-core" }

anyhow = "1"
async-trait = "0.1"
bytes = "1.10"
futures = "0.3"
futures-core = "0.3"
libloading = "0.9"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

# dev
cbindgen = { version = "0.29", default-features = false }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
# `deny` rather than `forbid`: the ABI crates (medicus-abi, medicus-host, medicus-addon-sdk) opt in
# with a documented `#![allow(unsafe_code)]`. Everything else must stay safe.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
