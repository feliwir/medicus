# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# medicus is MIT-licensed; only permissive, MIT-compatible dependency licences are allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained but without a known vulnerability or a maintained replacement upstream. Revisit when
# dicom-rs moves off them.
ignore = [
    # `encoding`: dicom-encoding decodes DICOM character sets with it.
    { id = "RUSTSEC-2021-0153", reason = "used by dicom-encoding; no alternative upstream" },
    # `paste`: a proc-macro (build time only) under exr, which dicom-pixeldata's `image` feature
    # enables unconditionally.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro under dicom-pixeldata/image/exr" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # Weak copyleft, file-level only (e.g. webpki-roots data). Never modify such files in-tree.
    "MPL-2.0",
]
exceptions = [
    # JPEG encoder of dicom-transfer-syntax-registry, derived from libjpeg. IJG is permissive but
    # requires an acknowledgement in the documentation of binary distributions: see NOTICE.
    { allow = ["IJG"], crate = "jpeg-encoder" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
