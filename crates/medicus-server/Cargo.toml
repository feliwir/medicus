[package]
name = "medicus-server"
description = "The medicus PACS core server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
authors.workspace = true

[[bin]]
name = "medicus"
path = "src/main.rs"

[features]
default = ["builtin-admin-ui", "builtin-storage-fs", "builtin-index-sqlite", "builtin-index-postgres", "builtin-dimse", "builtin-dicomweb", "builtin-events-webhook"]
builtin-admin-ui = ["dep:admin-ui"]
builtin-storage-fs = ["dep:storage-fs"]
builtin-index-sqlite = ["dep:index-sqlite"]
builtin-index-postgres = ["dep:index-postgres"]
builtin-dimse = ["dep:dimse"]
builtin-dicomweb = ["dep:dicomweb"]
builtin-events-webhook = ["dep:events-webhook"]

[dependencies]
arc-swap.workspace = true
argon2.workspace = true
getrandom.workspace = true
jsonschema.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rpassword.workspace = true
medicus-core.workspace = true
medicus-host.workspace = true
admin-ui = { path = "../../addons/admin-ui", optional = true }
dicomweb = { path = "../../addons/dicomweb", optional = true }
dimse = { path = "../../addons/dimse", optional = true }
events-webhook = { path = "../../addons/events-webhook", optional = true }
index-sqlite = { path = "../../addons/index-sqlite", optional = true }
index-postgres = { path = "../../addons/index-postgres", optional = true }
storage-fs = { path = "../../addons/storage-fs", optional = true }

anyhow.workspace = true
async-trait.workspace = true
async-stream = "0.3"
axum = "0.8"
bytes.workspace = true
futures.workspace = true
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
sha2 = "0.11"
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-json.workspace = true
dicom-object.workspace = true
# Deflated data sets are readable only with this feature.
dicom-transfer-syntax-registry.workspace = true
clap.workspace = true
figment.workspace = true
toml.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
example-c = { path = "../../addons/example-c" }
medicus-dimse.workspace = true
http-body-util = "0.1"
mime = "0.3"
multer = "3"
tower = { version = "0.5", features = ["util"] }
medicus-testkit.workspace = true
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
