[package]
name = "medicus-server"
description = "The medicus PACS core server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "medicus"
path = "src/main.rs"

[features]
default = ["builtin-storage-fs", "builtin-index-sqlite"]
builtin-storage-fs = ["dep:storage-fs"]
builtin-index-sqlite = ["dep:index-sqlite"]

[dependencies]
medicus-core.workspace = true
medicus-host.workspace = true
index-sqlite = { path = "../../addons/index-sqlite", optional = true }
storage-fs = { path = "../../addons/storage-fs", optional = true }

anyhow.workspace = true
async-trait.workspace = true
async-stream = "0.3"
axum = "0.8"
bytes.workspace = true
futures.workspace = true
hex = "0.4"
sha2 = "0.11"
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-json.workspace = true
dicom-object.workspace = true
clap.workspace = true
figment.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
medicus-testkit.workspace = true
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
