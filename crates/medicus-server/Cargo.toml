[package]
name = "medicus-server"
description = "The medicus PACS core server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "medicus"
path = "src/main.rs"

[features]
default = ["builtin-storage-fs", "builtin-index-sqlite", "builtin-dimse", "builtin-dicomweb", "builtin-events-webhook"]
builtin-storage-fs = ["dep:storage-fs"]
builtin-index-sqlite = ["dep:index-sqlite"]
builtin-dimse = ["dep:dimse"]
builtin-dicomweb = ["dep:dicomweb"]
builtin-events-webhook = ["dep:events-webhook"]

[dependencies]
medicus-core.workspace = true
medicus-host.workspace = true
dicomweb = { path = "../../addons/dicomweb", optional = true }
dimse = { path = "../../addons/dimse", optional = true }
events-webhook = { path = "../../addons/events-webhook", optional = true }
index-sqlite = { path = "../../addons/index-sqlite", optional = true }
storage-fs = { path = "../../addons/storage-fs", optional = true }

anyhow.workspace = true
async-trait.workspace = true
async-stream = "0.3"
axum = "0.8"
bytes.workspace = true
futures.workspace = true
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
sha2 = "0.11"
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-json.workspace = true
dicom-object.workspace = true
# Deflated data sets are readable only with this feature.
dicom-transfer-syntax-registry.workspace = true
clap.workspace = true
figment.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
medicus-dimse.workspace = true
http-body-util = "0.1"
mime = "0.3"
multer = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tower = { version = "0.5", features = ["util"] }
medicus-testkit.workspace = true
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
