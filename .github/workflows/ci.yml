name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc

  # The admin UI (addons/admin-ui/ui): types, unit tests and the production build the admin-ui addon embeds.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons/admin-ui/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addons/admin-ui/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The C example addon under AddressSanitizer: memory errors in the C ABI path fail CI.
  c-addon-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tests with an ASan-instrumented C addon
        run: MEDICUS_C_SANITIZE=address cargo test -p medicus-host --test abi --no-run
      - name: Run the C addon test with the ASan runtime preloaded
        run: |
          bin=$(cargo test -p medicus-host --test abi --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "abi") | .executable')
          LD_PRELOAD=$(cc -print-file-name=libasan.so) ASAN_OPTIONS=detect_leaks=1 "$bin" c_addon
        env:
          MEDICUS_C_SANITIZE: address

  # The DIMSE addon against DCMTK's echoscu/storescu.
  dcmtk-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y dcmtk
      - run: cargo test -p medicus-server --lib dcmtk_tests
        env:
          MEDICUS_DCMTK_BIN: /usr/bin

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # The conformance statement as PDF (its generated tables are checked by the tests).
  conformance-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: typst compile docs/conformance/conformance-statement.typ conformance-statement.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-statement
          path: conformance-statement.pdf

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
